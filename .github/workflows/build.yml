name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # test-integration runs against a real apiserver, which is the point: what
      # it checks is what actually happens in one, and a fake would only confirm
      # the code calls the functions it calls.
      - name: Tests
        run: make test
      # ⚠️ codegen's protobuf target shells out to protoc, and go-to-protobuf
      # log.Fatalf's when it is not on PATH. Without this the step below is red on
      # arrival -- and a guard that is red on arrival gets deleted, which is worse
      # than not having written it.
      #
      # Pinned, because generated .pb.go can differ between protoc versions and an
      # unpinned one turns "the types changed" into "the runner changed".
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler=3.21.12-*
          protoc --version
      # ⭐ 68k lines of generated code that cannot be hand-edited into agreement
      # with their source types. The protobuf half is why this is a guard: a field
      # added without regenerating is accepted by the API server, reported as
      # created, and then silently absent when read back.
      - name: Generated code is up to date
        run: make verify-codegen

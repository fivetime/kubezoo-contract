# 冻结的租户不得再写任何东西 —— 包括它预置的 ServiceAccount。
#
# ⚠️ 原生 VAP,不是 Kyverno,而且必须在**上游**强制。理由更新过一次,结论没变:
#
#   早先(审计 §S 实测):租户的 Pod 拿 SA token **直连上游,完全不经过 kubezoo**,
#   所以前门那一层只管租户本人的 kubectl。
#
#   现在的部署形态把那条路在**网络上**堵住了(见 operations-cn.md §1.2),
#   而且前门的 WithTenantSuspension **确实覆盖 SA 请求**(租户 ID 从
#   system:serviceaccount:<tid>-ns:name 里切出来)。⇒ 上面那个理由不再成立。
#
# ⭐ 但这条策略**仍然承重**,换了个理由:WithTenantSuspension 在 informer 缓存里
#   找不到租户时是**放行**的 —— 那是刻意的 fail-open,注释里写着"靠上游 RBAC 兜底"。
#   这条 VAP 就是那个"上游"。没有它,那次放行没有任何东西接住。
#
# ⛔ 所以两条前提别混:网络隔离让"绕过前门"这条路消失,它并不让"前门自己放行"
#   这件事消失,而后者是设计里明写的。
#
# 为什么单靠撤销 RoleBinding 不够(审计 §T,实测):
#   冻结撤销的是 kubezoo 下发的 kubezoo:tenant-admin;
#   租户**自建**的 RoleBinding 原样保留(冻结的设计前提是什么都不删),
#   于是它的 Pod 在冻结期间照样 GET 200 / CREATE 201,对象真的写进去。
#   ⇒ 冻的是 kubectl,不是租户。
#
# 触发条件是 kubezoo 控制器在冻结时给租户每个 namespace 打的 kubezoo.io/frozen 标签
# ——上游看不到 Tenant 对象,标签是前门告诉上游"哪些 namespace 冻着"的唯一途径。
#
# ⭐ 表达式写成"**放行不属于本租户的身份**",而不是"拒绝租户" ——
# 冻结期间平台自己仍要能动这些对象:kubelet 更新 Pod 状态(system:node:*)、
# controller-manager 收敛副本、GC 清理、kubezoo 控制器自己解冻。
# 判据是"请求者是不是本租户 namespace 里的 ServiceAccount":
#   system:serviceaccount:111111-default:default → 租户前缀 111111 == 目标 ns 前缀 ⇒ 拒
#   system:serviceaccount:kube-system:...        → kube        != 111111        ⇒ 放行
#   system:node:... / system:kube-controller-manager 等非 SA    ⇒ 放行
#
# ⚠️ **只拦写,不拦读**:冻结的承诺是"什么都不删、负载照常跑",
# 读不会销毁证据,而拦掉读会让还在跑的负载直接崩掉。前门对租户 kubectl 连读也拒,
# 那是针对操作人的,和这里不是一回事。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-frozen-deny-writes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # ⚠️⚠️ scope: Namespaced 不是可省的。`matchResources.namespaceSelector`
      # 对**集群级资源根本不过滤** —— k8s 的语义是"cluster-scoped 资源永不跳过策略"。
      # 少了这一行,本规则会套到**全集群每一次集群级写入**上,而那时
      # request.namespace 是空串,下面的 split 越界报错,配上 failurePolicy: Fail
      # 就是拒绝。**实测后果:Kyverno 注册不了自己的 webhook,三条策略永远不就绪,
      # 而 `kubectl get clusterpolicy` 只显示 READY=<none>,看着像还没同步完。**
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: Namespaced
  validations:
    # 第一个子句是**兜底**:scope: Namespaced 之后 request.namespace 不该为空,
    # 但空串会让 split 越界,而 CEL 表达式报错在 failurePolicy: Fail 下等同拒绝 ——
    # 那是本项目已经栽过一次的形态,便宜的守卫留着。
    # ⚠️ 租户 ID 是 namespace 的**前 6 个字符**(Go 侧权威实现:
    # util.GetTenantIDFromNamespace 取 namespace[:6] 并校验 namespace[6] == '-'),
    # 不是"第一个 - 之前的部分"。ValidateTenantName **允许租户 ID 里含 '-'**。
    #
    # ⛔ 原来写的是 split('-')[0],它算出的是**更粗的前缀**,所以不会漏放、
    # 只会**多拒**。具体:冻结租户 `kube-1`(6 位、第 5 位是 '-',合法),
    # kube-system 的控制器 SA 往 `kube-1-default` 写时,
    # 'kube-system'.split('-')[0] == 'kube' == 'kube-1-default'.split('-')[0]
    # ⇒ 三个子句全假 ⇒ **拒绝**。那正是 README 里写明要避免的"把 controller-manager
    # 一起拦掉,症状是租户 Deployment 永远不出 Pod 且没有任何报错指向策略"。
    #
    # ⚠️ substring 对短字符串会**报错**,所以两边都要先判长度 —— 只有原来那个
    # `request.namespace == ''` 的兜底是不够的。
    - expression: >-
        size(request.namespace) < 7 ||
        !request.userInfo.username.startsWith('system:serviceaccount:') ||
        size(request.userInfo.username.split(':')[2]) < 7 ||
        request.userInfo.username.split(':')[2].substring(0, 6) != request.namespace.substring(0, 6)
      message: "this tenant is frozen: its credentials cannot change anything until it is lifted. Nothing of yours has been deleted"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-frozen-deny-writes
spec:
  policyName: tenant-frozen-deny-writes
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubezoo.io/frozen
          operator: Exists

# 落点控制:每租户节点池 + 注入替换。
#
# > 一句话原则(用户定案):租户看不到节点,没有任何调度权,他写的东西会被平台替换掉。
#
# 池子约定:节点带标签 kubezoo.io/pool=<租户ID>,并带同值的 NoSchedule 污点。
# ⭐ 那个标签**必须每租户专属** —— 见架构 §8.2.2:在 pods/binding 那条路上
# kubelet 不检 NoSchedule 污点、但检 nodeSelector,所以注入的 selector 是
# 跨租户 binding 的唯一拦阻。用一个所有池子共有的标签等于没兜住。
#
# ⚠️ tolerations 里必须带上 not-ready / unreachable:JSON6902 的 add 是整体替换,
# 会把 DefaultTolerationSeconds(进程内插件,webhook 之前就跑了)加的那两条冲掉,
# 后果是节点 NotReady 时 Pod 立刻被驱逐而不是等 300s。
#
# ⚠️ 用了 JSON6902 就没有 autogen(见 README),所以 9 个 kind 全部显式写。
#
# ⭐ 平台跑在租户 namespace 里的 pod(带 kubezoo.io/platform-workload=true,目前是每租户的
# CoreDNS)**不豁免**,和租户负载一样被注入落点。曾经豁免过,理由是"池节点是虚拟 kubelet、
# 不实现 ClusterIP,resolver 会永远 not ready"。⚠️ 前半句对、结论错:knaas 给每个 Service 建
# Octavia LB(member 取自 EndpointSlice、按 readiness 门控),但 **VIP 是在租户网络上分配的**,
# 所以 capsule 真正能用的地址并不是上游集群分配的那个 ClusterIP。补这个差是 kubezoo 边界上的
# 一次翻译,不是把 resolver 留在池外的理由。
# ⭐ 而且 resolver **必须**落在池节点上:它自己的 pod IP 得是 OVN 地址才能当 Octavia member,
# 否则租户的 capsule 反而够不到解析器。跑在平台的真 worker 上(Cilium 地址)才是坏的那种。
# ⚠️ 万一某个部署的池节点确实跑不了 resolver,后果是有界的:网关只注入**正在 serving** 的
# resolver,所以租户退回平台 DNS,不会掉进"dnsPolicy:None 且无人应答"。
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-placement
  annotations:
    policies.kyverno.io/title: 租户落点由平台替换
spec:
  failurePolicy: Fail
  background: false
  rules:
    - name: place-pod
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
              namespaceSelector:
                matchExpressions:
                  - key: kubezoo.io/tenant
                    operator: Exists
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/nodeSelector
            value:
              kubezoo.io/pool: "{{ truncate(request.namespace, `6`) }}"
          - op: add
            path: /spec/tolerations
            value:
              - key: kubezoo.io/pool
                operator: Equal
                value: "{{ truncate(request.namespace, `6`) }}"
                effect: NoSchedule
              - key: node.kubernetes.io/not-ready
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
              - key: node.kubernetes.io/unreachable
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
          - op: add
            path: /spec/schedulerName
            value: default-scheduler
          - op: remove
            path: /spec/affinity
          - op: remove
            path: /spec/topologySpreadConstraints

    - name: place-controller
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, ReplicationController, Job]
              operations: [CREATE]
              namespaceSelector:
                matchExpressions:
                  - key: kubezoo.io/tenant
                    operator: Exists
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/template/spec/nodeSelector
            value:
              kubezoo.io/pool: "{{ truncate(request.namespace, `6`) }}"
          - op: add
            path: /spec/template/spec/tolerations
            value:
              - key: kubezoo.io/pool
                operator: Equal
                value: "{{ truncate(request.namespace, `6`) }}"
                effect: NoSchedule
              - key: node.kubernetes.io/not-ready
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
              - key: node.kubernetes.io/unreachable
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
          - op: add
            path: /spec/template/spec/schedulerName
            value: default-scheduler
          - op: remove
            path: /spec/template/spec/affinity
          - op: remove
            path: /spec/template/spec/topologySpreadConstraints

    - name: place-cronjob
      match:
        any:
          - resources:
              kinds: [CronJob]
              operations: [CREATE]
              namespaceSelector:
                matchExpressions:
                  - key: kubezoo.io/tenant
                    operator: Exists
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/jobTemplate/spec/template/spec/nodeSelector
            value:
              kubezoo.io/pool: "{{ truncate(request.namespace, `6`) }}"
          - op: add
            path: /spec/jobTemplate/spec/template/spec/tolerations
            value:
              - key: kubezoo.io/pool
                operator: Equal
                value: "{{ truncate(request.namespace, `6`) }}"
                effect: NoSchedule
              - key: node.kubernetes.io/not-ready
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
              - key: node.kubernetes.io/unreachable
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
          - op: add
            path: /spec/jobTemplate/spec/template/spec/schedulerName
            value: default-scheduler
          - op: remove
            path: /spec/jobTemplate/spec/template/spec/affinity
          - op: remove
            path: /spec/jobTemplate/spec/template/spec/topologySpreadConstraints

    - name: place-podtemplate
      match:
        any:
          - resources:
              kinds: [PodTemplate]
              operations: [CREATE]
              namespaceSelector:
                matchExpressions:
                  - key: kubezoo.io/tenant
                    operator: Exists
      mutate:
        patchesJson6902: |-
          - op: add
            path: /template/spec/nodeSelector
            value:
              kubezoo.io/pool: "{{ truncate(request.namespace, `6`) }}"
          - op: add
            path: /template/spec/tolerations
            value:
              - key: kubezoo.io/pool
                operator: Equal
                value: "{{ truncate(request.namespace, `6`) }}"
                effect: NoSchedule
              - key: node.kubernetes.io/not-ready
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
              - key: node.kubernetes.io/unreachable
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 300
          - op: add
            path: /template/spec/schedulerName
            value: default-scheduler
          - op: remove
            path: /template/spec/affinity
          - op: remove
            path: /template/spec/topologySpreadConstraints

# 租户只能声明自己子域下的主机名。
#
# ⛔ 不加这条会怎样(审计 §AH,实测):`spec.rules[].host` 是一个自由的 DNS 名,
# kubezoo 表达不了它(前缀化一个域名就毁了它的用途)。于是**任何租户可以声明任何主机名**,
# 由 ingress 控制器按**创建顺序**裁决 —— 先到先得,**落败的一方零报错**:
# 对象在、class 在、status 也有地址,就是永远不服务流量。
#
# 抢不走已被占用的,但可以**抢先占用**别人还没声明的 —— 那就是拒绝服务 +
# 把本该属于别人的流量接到自己这里。
#
# ⇒ 判据:纯写路径、不需要看响应、且"换个平台会变"(域名方案是平台自己的)
#    ⇒ 策略层。用原生 VAP 而不是 Kyverno:一条 CEL 就够,而且进程内、无 webhook。
#
# ⚠️⚠️ 下面的域名后缀是**环境相关的**,部署时必须换成本平台给租户分配子域的那个后缀。
# 租户 111111 于是只能声明 *.111111.<后缀>。
#
# ⚠️ **这只解决了"默认安全"的一半。** 真实客户会要用自己的域名(shop.customer.com),
# 那需要一份**每租户的自定义域名白名单** + 域名归属校验(DNS TXT 之类),
# 而且白名单必须放在**租户改不动**的地方(租户能给自己的 namespace 打任意标签/注解,
# 放那里就是"判定条件建立在租户可控输入上"那个老坑)。
# 那一半是产品决策,未做 —— 见 TODO。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-ingress-hostnames
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
        scope: Namespaced
  variables:
    # namespace 上游形如 <租户ID>-<租户视角的名字>,而租户伪造不了这个前缀:
    # kubezoo 在写入时强制加上,并拒绝租户把 kubezoo.io/tenant 标签改成别人的。
      # ⚠️ 租户 ID 是 namespace 的**前 6 个字符**,不是"第一个 - 之前的部分"。
      # Go 侧的权威实现是 util.GetTenantIDFromNamespace:取 namespace[:6],
      # 并校验 namespace[6] == '-'。而 ValidateTenantName **允许租户 ID 里含 '-'**
      # (只要不在开头),例如 `ab-123` 是合法的 6 位 ID。
      # ⛔ 用 split("-")[0] 的话,`ab-123` 和 `ab-456` 会算出同一个租户 ——
      # 这条策略要防的跨租户主机名抢占,会被这个推导本身重新打开。
    - name: tenantSuffix
      expression: '"." + request.namespace.substring(0, 6) + ".TENANT_DOMAIN_SUFFIX"'
  validations:
    # 空 host 表示"匹配所有主机名",那等于把整个入口占了,必须拒。
    #
    # ⛔ `has(object.spec.rules)` 不是装饰。spec.rules 是**可选的** —— 只带
    # defaultBackend 的 Ingress 完全合法 —— 而 CEL 读一个不存在的字段会**求值出错**,
    # 加上 failurePolicy: Fail 就等于**拒绝**。实测:这样的 Ingress 一直被拒,
    # 而且 `denied request:` 后面**什么都没有**,因为 messageExpression 也在同一个
    # 缺失字段上炸掉了。租户看到的是一条没有任何内容的拒绝。
    - expression: >-
        !has(object.spec.rules) || object.spec.rules.all(rule,
          has(rule.host) && rule.host != "" && rule.host.endsWith(variables.tenantSuffix))
      messageExpression: >-
        "an Ingress may only claim host names under this tenant's own subdomain (" +
        variables.tenantSuffix + "); a bare or foreign host name would take traffic from
        whoever else claims it, and the loser is told nothing"
    # ⛔ spec.tls[].hosts is a SECOND list of host names, and it was not checked.
    # It decides which names the ingress controller presents a certificate for --
    # the SNI side of the same claim the rule above guards. Left open, a tenant
    # could name someone else's domain there: the controller answers the TLS
    # handshake for a name the tenant does not own, and where cert-manager or
    # similar is wired in, a certificate may be requested for it.
    #
    # ⚠️ Both lists are optional and an empty one is ordinary, so this checks the
    # entries rather than requiring any: no tls at all is fine (plain HTTP), and
    # tls without hosts is fine too (it means "use the default certificate").
    # Requiring them would refuse most Ingresses ever written.
    - expression: >-
        !has(object.spec.tls) || object.spec.tls.all(entry,
          !has(entry.hosts) || entry.hosts.all(host, host.endsWith(variables.tenantSuffix)))
      messageExpression: >-
        "an Ingress may only list host names under this tenant's own subdomain (" +
        variables.tenantSuffix + ") in spec.tls; naming another domain there makes the
        ingress controller answer TLS for a name this tenant does not own"
    # ⛔ 第三张主机名表,而且它**不在 spec 里** —— `server-alias` 注解。
    # 上游模板把它和 host 放进**同一条 server_name**:
    #   rootfs/etc/nginx/template/nginx.tmpl:639
    #   server_name {{ buildServerName $server.Hostname }} {{ range $server.Aliases }}"{{ . }}" {{ end }};
    # ⇒ 上面两条 validation 拦下的东西,一条注解就能原样拿回去。
    # 这不是"注解没过滤"这种泛泛的话:它是**这条策略自己**的一个绕过口。
    #
    # ⚠️ 不是禁掉,是**同样约束**:租户给自己的子域加 alias 是正当用法。
    # (其余高风险注解由 tenant-ingress-annotations 整族拒绝,唯独这条留在这里,
    #  因为它是主机名声明,归这条策略管。)
    #
    # ⛔ 三个细节都来自上游 `ValidateArrayOfServerName`
    # (internal/ingress/annotations/parser/validators.go:89),不是猜的:
    #  1. 值是**逗号分隔的一串**,不是单个名字 —— 只查整串就等于只查最后一段;
    #  2. 每一项**允许是正则**(上游注释原话:"They can be *.something*,
    #     ~^www\d+\.example\.com$")。nginx 的正则 server_name 不隐式锚定,
    #     "以租户后缀结尾的正则"和"租户后缀下的主机名"是两回事 ⇒ 带 `~` 的一律拒,
    #     这比去推 nginx 的正则匹配语义可靠。
    #  3. 上游逐项 TrimSpace,所以这里也 trim —— 否则 "a.x, b.x" 的第二项会因为
    #     前导空格被误拒,而上游本来是接受的。
    - expression: >-
        !has(object.metadata.annotations) ||
        !("nginx.ingress.kubernetes.io/server-alias" in object.metadata.annotations) ||
        object.metadata.annotations["nginx.ingress.kubernetes.io/server-alias"]
          .split(",").all(alias,
            !alias.contains("~") && alias.trim().endsWith(variables.tenantSuffix))
      messageExpression: >-
        "the server-alias annotation is a second list of host names -- the ingress
        controller puts it into the same server_name as spec.rules[].host -- so it is
        held to the same rule: every entry must fall under this tenant's own subdomain
        (" + variables.tenantSuffix + "), and none may be a regex"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-ingress-hostnames
spec:
  policyName: tenant-ingress-hostnames
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubezoo.io/tenant
          operator: Exists
